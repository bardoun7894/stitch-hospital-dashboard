[opcache]
; Enable OPcache for both CLI and web SAPI
opcache.enable=1
opcache.enable_cli=1

; Memory allocation: 256MB for compiled script bytecode cache
opcache.memory_consumption=256

; Interned strings buffer: 64MB for shared string storage
opcache.interned_strings_buffer=64

; Max number of PHP files that can be cached (prime-like number)
opcache.max_accelerated_files=20000

; Production mode: disable timestamp validation for maximum performance
; Scripts are never automatically checked for changes on disk.
; You must clear OPcache manually (e.g., via php artisan opcache:clear or
; by restarting the container) after deploying new code.
opcache.validate_timestamps=0

; Preserve doc-block comments (required by Laravel and many packages
; that rely on annotations/attributes)
opcache.save_comments=1

; JIT compilation settings (PHP 8.x+)
; 1255 = tracing JIT for all functions at optimization level 5
opcache.jit=1255

; JIT buffer: 128MB reserved for machine-code generated by the JIT compiler
opcache.jit_buffer_size=128M

[realpath_cache]
; Increase realpath cache to 4MB for faster file path resolution
; (Laravel resolves thousands of class files on every request)
realpath_cache_size=4096K

; Cache resolved real paths for 10 minutes (600 seconds)
realpath_cache_ttl=600

[xdebug]
; Disable Xdebug in production (conflicts with JIT and adds overhead)
xdebug.mode=off
