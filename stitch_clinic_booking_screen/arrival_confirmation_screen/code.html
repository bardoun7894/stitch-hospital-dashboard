<!DOCTYPE html>

<html class="light" dir="rtl" lang="ar"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Arrival Confirmation</title>
<!-- Tailwind CSS -->
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<!-- Google Fonts: Inter & Noto Sans Arabic -->
<link href="https://fonts.googleapis.com" rel="preconnect"/>
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;family=Noto+Sans+Arabic:wght@400;500;700&amp;display=swap" rel="stylesheet"/>
<!-- Material Symbols -->
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<!-- Theme Configuration -->
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#13ec13",
                        "primary-dark": "#0eb50e",
                        "background-light": "#f6f8f6",
                        "background-dark": "#102210",
                        "surface-light": "#ffffff",
                        "surface-dark": "#1a331a",
                        "text-main": "#0d1b0d",
                        "text-sub": "#4a594a",
                    },
                    fontFamily: {
                        "display": ["Noto Sans Arabic", "Inter", "sans-serif"],
                        "numbers": ["Inter", "sans-serif"],
                    },
                    borderRadius: {
                        "DEFAULT": "0.375rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "2xl": "1rem",
                        "full": "9999px"
                    },
                    animation: {
                        'pulse-slow': 'pulse 3s cubic-bezier(0.4, 0, 0.6, 1) infinite',
                    }
                },
            },
        }
    </script>
<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 1, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background-light dark:bg-background-dark min-h-screen flex flex-col font-display antialiased transition-colors duration-200">
<!-- Top App Bar -->
<header class="flex items-center justify-between p-4 sticky top-0 z-10 bg-background-light/80 dark:bg-background-dark/80 backdrop-blur-md">
<button aria-label="Go back" class="flex items-center justify-center p-2 rounded-full hover:bg-black/5 dark:hover:bg-white/10 transition-colors text-text-main dark:text-white">
<!-- Using arrow_forward for RTL back button context -->
<span class="material-symbols-outlined text-[24px]">arrow_forward</span>
</button>
<div class="text-sm font-medium text-text-sub dark:text-gray-400">تأكيد الوصول</div>
<button aria-label="Help" class="flex items-center justify-center p-2 rounded-full hover:bg-black/5 dark:hover:bg-white/10 transition-colors text-text-main dark:text-white">
<span class="material-symbols-outlined text-[24px]">help</span>
</button>
</header>
<!-- Main Content Area -->
<main class="flex-1 flex flex-col items-center justify-center px-6 w-full max-w-md mx-auto relative">
<!-- Hero Visual: Map & Success Indicator -->
<div class="relative mb-8 group">
<!-- Pulsing Effect Rings -->
<div class="absolute inset-0 rounded-full bg-primary/20 animate-pulse-slow scale-150 blur-xl"></div>
<div class="absolute inset-0 rounded-full bg-primary/30 animate-pulse scale-110 blur-md"></div>
<!-- Map Container -->
<div class="relative w-48 h-48 rounded-full border-4 border-white dark:border-surface-dark shadow-xl overflow-hidden z-10 bg-gray-200">
<div class="w-full h-full bg-cover bg-center opacity-80" data-alt="Abstract map view showing clinic location radius" data-location="Riyadh Clinic Map" style="background-image: url('https://lh3.googleusercontent.com/aida-public/AB6AXuAkX6DHp9bn7U6O54iI9xtoJjyf0kNLlsUZM111eysDDlFlsaEW-Dnir4Mhd2ASespcLTpJOqxZqrCYUw6EiWUcOrZDSa_5aVuJVLHz9EoYnleYr-yW0hKXpAIGWEbTncd0baQvsy3ozmCFGif6TSqRqLI_taS9O6jXZe7DqTdRL0b6lJh4Mowl40p9u76t4fZNIdvyC4295dfXeXxB51vycvS25m_nqMTeoNKLn9eaGklxm45z8kdo5Dosqqs-BIcHPiU9zp71-cA');"></div>
<!-- Center Pin on Map -->
<div class="absolute inset-0 flex items-center justify-center">
<div class="w-4 h-4 bg-primary rounded-full shadow-[0_0_0_4px_rgba(19,236,19,0.3)]"></div>
</div>
</div>
<!-- Success Icon Overlay -->
<div class="absolute -bottom-2 -right-2 z-20 bg-primary text-black rounded-full p-3 shadow-lg border-4 border-background-light dark:border-background-dark flex items-center justify-center">
<span class="material-symbols-outlined text-[32px]">check</span>
</div>
</div>
<!-- Text Content -->
<div class="text-center mb-10">
<h1 class="text-text-main dark:text-white text-[32px] font-bold leading-tight mb-3">
                لقد وصلت إلى العيادة!
            </h1>
<p class="text-text-sub dark:text-gray-300 text-base font-normal leading-relaxed px-4">
                يرجى تأكيد تواجدك ليتم إدراجك في قائمة الانتظار الحالية وإخطار الطبيب بوصولك.
            </p>
</div>
<!-- Status Card -->
<div class="w-full bg-surface-light dark:bg-surface-dark rounded-2xl p-5 shadow-sm border border-black/5 dark:border-white/5 mb-6">
<div class="flex items-center justify-between divide-x divide-x-reverse divide-gray-100 dark:divide-gray-700">
<!-- Current Turn -->
<div class="flex-1 flex flex-col items-center justify-center px-2">
<span class="text-xs font-medium text-text-sub dark:text-gray-400 mb-1 uppercase tracking-wider">الدور الحالي</span>
<span class="text-3xl font-bold font-numbers text-text-main dark:text-white">24</span>
<div class="flex items-center gap-1 mt-1 text-green-600 dark:text-primary text-[10px] font-bold bg-green-50 dark:bg-primary/10 px-2 py-0.5 rounded-full">
<span class="w-1.5 h-1.5 rounded-full bg-current animate-pulse"></span>
                        مباشر
                    </div>
</div>
<!-- User Token -->
<div class="flex-1 flex flex-col items-center justify-center px-2 relative overflow-hidden">
<span class="text-xs font-medium text-text-sub dark:text-gray-400 mb-1 uppercase tracking-wider">رقمك</span>
<span class="text-4xl font-bold font-numbers text-primary dark:text-primary drop-shadow-sm">29</span>
<span class="text-[10px] text-text-sub dark:text-gray-500 mt-1">تقريباً ١٥ دقيقة</span>
</div>
</div>
</div>
</main>
<!-- Bottom Action Area -->
<div class="p-6 bg-background-light dark:bg-background-dark sticky bottom-0 z-20">
<button class="w-full bg-primary hover:bg-primary-dark active:scale-[0.98] transition-all duration-200 text-[#003300] font-bold text-lg h-14 rounded-xl flex items-center justify-center gap-2 shadow-[0_4px_14px_0_rgba(19,236,19,0.39)]">
<span>تأكيد الحضور</span>
<span class="material-symbols-outlined text-[20px] rtl:-scale-x-100">login</span>
</button>
<p class="text-center text-xs text-text-sub dark:text-gray-500 mt-3 opacity-60">
            سيتم تفعيل رقمك فور التأكيد
        </p>
</div>
</body></html>
